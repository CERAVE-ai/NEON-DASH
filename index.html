<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash - Desafío Mental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #000428, #004e92);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
            max-width: 100%;
            max-height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 0 10px #00f2ff;
            z-index: 5;
        }
        /* Estilo para los mensajes de advertencia */
        #warning-msg {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 40%;
            font-size: 5rem;
            font-weight: 900;
            color: rgba(255, 0, 85, 0.5);
            text-transform: uppercase;
            letter-spacing: 5px;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.3s ease;
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
            display: none;
        }
        #effect-msg {
            position: absolute;
            top: 22%;
            width: 100%;
            text-align: center;
            color: #ffe600;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 6;
            display: none;
            text-shadow: 0 0 12px #ff0055, 0 0 24px #ffe600;
        }
        #flash-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 0, 85, 0.28);
            pointer-events: none;
            z-index: 4;
            display: none;
        }
        #game-container.screen-shake {
            animation: screen-shake 0.07s infinite;
        }
        #game-container.glitch-mode canvas {
            filter: hue-rotate(70deg) saturate(1.8);
        }
        @keyframes screen-shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(5px, -3px); }
            50% { transform: translate(-4px, 4px); }
            75% { transform: translate(3px, 2px); }
            100% { transform: translate(-2px, -4px); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 0.4s infinite;
        }
        @keyframes pulse-fast {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }
        .btn-action {
            background: #ff0055;
            color: #fff;
            padding: 15px 50px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.1s;
            border: none;
            margin-top: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        .win-glow {
            color: #00f2ff;
            text-shadow: 0 0 20px #00f2ff, 0 0 40px #00f2ff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Mensaje de advertencia que alternará su contenido -->
    <div id="warning-msg" class="animate-pulse-fast">¡Te Vas A Morir Ya!</div>
    <div id="effect-msg"></div>
    <div id="flash-overlay"></div>
    
    <!-- HUD de puntuación -->
    <div id="ui-overlay">
        <div class="text-3xl font-black italic">PUNTOS: <span id="score">0</span></div>
        <div class="text-sm font-bold opacity-80 uppercase tracking-widest">RÉCORD: <span id="highScore">0</span></div>
        <div class="text-xs mt-1 text-cyan-400 font-bold">VELOCIDAD: <span id="speed-display">0</span></div>
    </div>

    <!-- Menú principal / Fin de juego -->
    <div id="menu-overlay" class="overlay-screen">
        <h1 class="text-7xl font-black mb-2 tracking-tighter text-white">NEON <span class="text-pink-600">DASH</span></h1>
        <p id="game-status-label" class="bg-pink-600 text-white px-4 py-1 text-xs font-bold tracking-[0.3em] mb-6">MODO PSICOLÓGICO</p>
        <p id="final-score-msg" class="text-2xl mb-8 hidden font-bold">PUNTUACIÓN: <span id="last-score" class="text-pink-500">0</span></p>
        <button id="startBtn" class="btn-action">JUGAR</button>
        <div class="mt-8 text-xs text-gray-400 uppercase tracking-widest italic text-center">
            Objetivo: sobrevivir el mayor tiempo posible<br>
            ¡Los mensajes intentarán distraerte!
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const speedDisplay = document.getElementById('speed-display');
    const highScoreElement = document.getElementById('highScore');
    const menuOverlay = document.getElementById('menu-overlay');
    const warningMsg = document.getElementById('warning-msg');
    const effectMsg = document.getElementById('effect-msg');
    const flashOverlay = document.getElementById('flash-overlay');
    const gameContainer = document.getElementById('game-container');
    const lastScoreElement = document.getElementById('last-score');
    const finalScoreMsg = document.getElementById('final-score-msg');
    const startBtn = document.getElementById('startBtn');
    const statusLabel = document.getElementById('game-status-label');

    // Configuración de juego
    let gameActive = false;
    let score = 0;
    let highScore = localStorage.getItem('neonDashHighScore') || 0;
    highScoreElement.innerText = highScore;

    const GRAVITY = 1.4;        
    const JUMP_FORCE = -18.5;      
    const GROUND_Y_OFFSET = 120;
    const START_SPEED = 11;
    const SPEED_INCREMENT = 0.195; // Aumento de velocidad por cada obstáculo superado.
    let gameSpeed = START_SPEED;
    let animationId = null;

    // Temporizador y mensajes alternos
    let warningTimer = 0;
    const SEC_5_IN_FRAMES = 300; 
    const messages = [
        "¡Te Vas A Morir Ya!",
        "¡Eres Muy Malo!",
        "¡MIRA DETRÁS DE TI!",
        "¡NO PIERDAS LA CONCENTRACIÓN!",
        "¡SALTA AHORA! ¿O NO?"
    ];
    let currentMessageIndex = 0;
    let nextAnnoyanceFrame = 360;
    let effectMessageTimer = 0;
    let screenShakeTimer = 0;
    let flashTimer = 0;
    let glitchTimer = 0;

    // Variables de control de salto
    let jumpBufferCounter = 0;
    const JUMP_BUFFER_FRAMES = 10;
    let isOnGround = false;

    function resize() {
        canvas.width = Math.min(window.innerWidth, 1200);
        canvas.height = 600;
    }
    window.addEventListener('resize', resize);
    resize();

    const player = {
        x: 180,
        y: 0,
        width: 44,
        height: 44,
        dy: 0,
        rotation: 0,
        reset() {
            this.y = canvas.height - GROUND_Y_OFFSET - this.height;
            this.dy = 0;
            this.rotation = 0;
        },
        draw() {
            ctx.save();
            ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
            ctx.rotate(this.rotation);
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00f2ff';
            ctx.fillStyle = '#00f2ff';
            ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(-this.width / 2, -this.height / 2, this.width, this.height);
            ctx.restore();
        },
        update() {
            this.dy += GRAVITY;
            this.y += this.dy;
            const groundY = canvas.height - GROUND_Y_OFFSET - this.height;
            
            if (this.y >= groundY) {
                this.y = groundY;
                this.dy = 0;
                isOnGround = true;
                const targetRot = Math.round(this.rotation / (Math.PI / 2)) * (Math.PI / 2);
                this.rotation += (targetRot - this.rotation) * 0.45;

                if (jumpBufferCounter > 0) this.executeJump();
            } else {
                isOnGround = false;
                this.rotation += 0.15 + (gameSpeed / 100); 
            }

            if (jumpBufferCounter > 0) jumpBufferCounter--;
        },
        executeJump() {
            this.dy = JUMP_FORCE;
            jumpBufferCounter = 0;
            isOnGround = false;
        },
        requestJump() {
            if (isOnGround) this.executeJump();
            else jumpBufferCounter = JUMP_BUFFER_FRAMES;
        }
    };

    let obstacles = [];
    class Obstacle {
        constructor(type) {
            this.width = 44;
            this.height = 48;
            this.x = canvas.width + 100;
            this.y = canvas.height - GROUND_Y_OFFSET - this.height;
            this.type = type;
            this.passed = false;
        }
        draw() {
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';
            if (this.type === 'spike') {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();
            } else {
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
            ctx.shadowBlur = 0;
        }
        update() {
            this.x -= gameSpeed;
        }
    }

    let frameCount = 0;
    let nextObstacleFrame = 0;
    let particles = [];

    function createExplosion(x, y, color) {
        for (let i = 0; i < 30; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 30,
                vy: (Math.random() - 0.5) * 30,
                size: Math.random() * 8 + 4,
                life: 1.0,
                color
            });
        }
    }

    function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.035;
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
    }

    function showEffectMessage(text, duration = 70) {
        effectMsg.innerText = text;
        effectMsg.style.display = 'block';
        effectMessageTimer = duration;
    }

    function triggerAnnoyance() {
        const effect = Math.floor(Math.random() * 4);
        screenShakeTimer = 30;
        flashTimer = 8;

        if (effect === 0) {
            showEffectMessage("¡NO TE DISTRAIGAS!");
        } else if (effect === 1) {
            glitchTimer = 65;
            showEffectMessage("¡INTERFERENCIA!");
        } else {
            showEffectMessage("¡SEÑUELO DETECTADO!");
            createExplosion(
                canvas.width * (0.35 + Math.random() * 0.45),
                canvas.height * (0.25 + Math.random() * 0.35),
                '#ffe600'
            );
        }
    }

    function updateAnnoyances() {
        if (screenShakeTimer > 0) {
            screenShakeTimer--;
            gameContainer.classList.add('screen-shake');
        } else {
            gameContainer.classList.remove('screen-shake');
        }

        if (glitchTimer > 0) {
            glitchTimer--;
            gameContainer.classList.add('glitch-mode');
        } else {
            gameContainer.classList.remove('glitch-mode');
        }

        if (flashTimer > 0) {
            flashTimer--;
            flashOverlay.style.display = 'block';
        } else {
            flashOverlay.style.display = 'none';
        }

        if (effectMessageTimer > 0) {
            effectMessageTimer--;
        } else {
            effectMsg.style.display = 'none';
        }

        if (frameCount >= nextAnnoyanceFrame) {
            triggerAnnoyance();
            nextAnnoyanceFrame = frameCount + 300 + Math.floor(Math.random() * 260);
        }
    }

    function drawGlitchLines() {
        if (glitchTimer <= 0) return;
        ctx.save();
        ctx.globalAlpha = 0.45;
        for (let i = 0; i < 5; i++) {
            const y = Math.random() * canvas.height;
            ctx.fillStyle = i % 2 === 0 ? '#ff0055' : '#00f2ff';
            ctx.fillRect(Math.random() * 30, y, canvas.width * (0.15 + Math.random() * 0.35), 2);
        }
        ctx.restore();
    }

    function checkCollision(p, o) {
        const paddingX = 4;
        const paddingY = 4;
        return (
            p.x + paddingX < o.x + o.width - paddingX &&
            p.x + p.width - paddingX > o.x + paddingX &&
            p.y + paddingY < o.y + o.height - paddingY &&
            p.y + p.height - paddingY > o.y + paddingY
        );
    }

    function handleGameOver() {
        gameActive = false;
        warningMsg.style.display = 'none';
        effectMsg.style.display = 'none';
        flashOverlay.style.display = 'none';
        gameContainer.classList.remove('screen-shake', 'glitch-mode');
        createExplosion(player.x + player.width/2, player.y + player.height/2, '#00f2ff');
        createExplosion(player.x + player.width/2, player.y + player.height/2, '#ffffff');
        
        updateHighScore();
        lastScoreElement.innerText = score;
        finalScoreMsg.classList.remove('hidden');
        statusLabel.innerText = "CRASH";
        statusLabel.classList.replace('bg-pink-600', 'bg-red-600');
        
        setTimeout(() => {
            if (!gameActive) menuOverlay.classList.remove('hidden');
        }, 600);
    }

    function updateHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('neonDashHighScore', highScore);
            highScoreElement.innerText = highScore;
        }
    }
    window.addEventListener('beforeunload', updateHighScore);

    function startGame() {
        cancelAnimationFrame(animationId);
        score = 0;
        gameSpeed = START_SPEED;
        scoreElement.innerText = score;
        speedDisplay.innerText = gameSpeed.toFixed(1);
        obstacles = [];
        particles = [];
        frameCount = 0;
        warningTimer = 0;
        currentMessageIndex = 0;
        warningMsg.innerText = messages[0];
        effectMsg.style.display = 'none';
        flashOverlay.style.display = 'none';
        gameContainer.classList.remove('screen-shake', 'glitch-mode');
        nextAnnoyanceFrame = 360;
        effectMessageTimer = 0;
        screenShakeTimer = 0;
        flashTimer = 0;
        glitchTimer = 0;
        nextObstacleFrame = 40; 
        jumpBufferCounter = 0;
        player.reset();
        gameActive = true;
        menuOverlay.classList.add('hidden');
        warningMsg.style.display = 'none';
        animate();
    }

    function drawBackground() {
        const groundY = canvas.height - GROUND_Y_OFFSET;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        let gap = 120;
        let offset = (frameCount * gameSpeed) % gap;
        for (let i = -offset; i < canvas.width; i += gap) {
            ctx.beginPath();
            ctx.moveTo(i, groundY);
            ctx.lineTo(i - 200, canvas.height); 
            ctx.stroke();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        
        if (gameActive) {
            updateAnnoyances();
            player.update();
            player.draw();

            // Lógica de mensajes alternos
            warningTimer++;
            let totalCycle = SEC_5_IN_FRAMES * 2; // 10 segundos totales por ciclo (5 OFF, 5 ON)
            let cycleFrame = warningTimer % totalCycle;
            
            if (cycleFrame === SEC_5_IN_FRAMES) {
                // A los 5 segundos de espera, elegimos mensaje y mostramos
                warningMsg.innerText = messages[currentMessageIndex];
                warningMsg.style.display = 'block';
                // Cambiamos el índice para la próxima vez
                currentMessageIndex = (currentMessageIndex + 1) % messages.length;
            } else if (cycleFrame === 0 && warningTimer > 0) {
                // Tras 5 segundos de visibilidad, ocultamos
                warningMsg.style.display = 'none';
            }

            if (frameCount >= nextObstacleFrame) {
                const type = Math.random() > 0.45 ? 'spike' : 'block';
                obstacles.push(new Obstacle(type));
                
                let minWait = Math.max(15, 30 - (gameSpeed / 2.5));
                let randomWait = Math.max(10, 20 - (gameSpeed / 5));
                nextObstacleFrame = frameCount + Math.floor(Math.random() * randomWait) + minWait;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();
                
                if (checkCollision(player, obstacles[i])) {
                    handleGameOver();
                    return;
                }
                
                if (!obstacles[i].passed && obstacles[i].x < player.x) {
                    obstacles[i].passed = true;
                    score++;
                    scoreElement.innerText = score;
                    updateHighScore();
                    gameSpeed += SPEED_INCREMENT; 
                    speedDisplay.innerText = gameSpeed.toFixed(1);
                }
                
                if (obstacles[i].x + obstacles[i].width < -100) {
                    obstacles.splice(i, 1);
                }
            }
        } else {
            player.draw();
        }

        drawParticles();
        drawGlitchLines();
        frameCount++;
        
        if (gameActive || particles.length > 0) {
            animationId = requestAnimationFrame(animate);
        }
    }

    function handleInput(e) {
        if (e.type === 'touchstart' || e.type === 'mousedown' || e.code === 'Space' || e.code === 'ArrowUp') {
            if (gameActive) {
                player.requestJump();
                if (e.cancelable) e.preventDefault();
            }
        }
    }

    startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
    });
    
    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, {passive: false});

    player.reset();
    drawBackground();
    player.draw();
</script>

</body>
</html>
